<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blutspende Statistik</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>

<body>



    <h1>Statistik</h1>

    <div class="background">

        <table class="stats">
            <tr>
                <th>
                    <p>Stühle</p>
                    <p id="stuhl_stats"></p>
                </th>
                <th>
                    <p>Betten</p>
                    <p id="bett_stats"></p>
                </th>
            </tr>
            <tr>
                <th colspan="2">
                    <p>Gesamt</p>
                    <p id="total_stats"></p>
                </th>
            </tr>
        </table>

        <button id="reset_stats" class="reset_button">
            Statistiken zurücksetzen
        </button>

    </div>

    <img id="home" alt="Home-Button" class="home" src="images/home.png">



    <script src="script.js"></script>
</body>

</html>
