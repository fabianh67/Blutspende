<!DOCTYPE html>

<html lang="de" xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta charset="utf-8" />
	<title>Blutspende Timer</title>

	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="images/favicon.png">
</head>


<body>

	<!--<h1>Timer</h1>-->
	<h2 id="clock">hh:mm:ss</h2>

	<div id="s" class="background">
		<h2>Stühle</h2>

		<button id="s0" class="timer_button">
			1
		</button>

		<button id="s1" class="timer_button">
			2
		</button>

		<button id="s2" class="timer_button">
			3
		</button>

		<button id="s3" class="timer_button">
			4
		</button>

		<button id="s4" class="timer_button">
			5
		</button>

		<button id="s5" class="timer_button">
			6
		</button>

		<button id="s6" class="timer_button">
			7
		</button>

		<button id="s7" class="timer_button">
			8
		</button>

		<button id="s8" class="timer_button">
			9
		</button>

		<button id="s9" class="timer_button">
			10
		</button>
	</div>


	<div id="b" class="background">
		<h2>Betten</h2>

		<button id="b0" class="timer_button">
			1
		</button>

		<button id="b1" class="timer_button">
			2
		</button>

		<button id="b2" class="timer_button">
			3
		</button>

		<button id="b3" class="timer_button">
			4
		</button>
		<br>

		<button id="skip0" class="skip_button">
			<img src="images/down.png" alt="down" class="arrow">
		</button>

		<button id="skip1" class="skip_button">
			<img src="images/down.png" alt="down" class="arrow">
		</button>

		<button id="skip2" class="skip_button">
			<img src="images/down.png" alt="down" class="arrow">
		</button>

		<button id="skip3" class="skip_button">
			<img src="images/down.png" alt="down" class="arrow">
		</button>

		<br>
		<button id="bs0" class="timer_button">
			1
		</button>

		<button id="bs1" class="timer_button">
			2
		</button>

		<button id="bs2" class="timer_button">
			3
		</button>

		<button id="bs3" class="timer_button">
			4
		</button>

		<br>
		<button id="erstspender" class="erstspender">
			15 Minuten liegen
		</button>
	</div>

	<div id="popupBackground" class="popupBackground hidden"></div>

	<div id="popupWindow" class="popupWindow hidden">

		<h2 id="popupTitle">Title</h2>
		<h3 id="popupSubtitle" class="popupSubtitle">Subtitle</h3>

		<button id="cancelButton" class="popupButton cancel">Nein</button>
		<button id="confirmButton" class="popupButton confirm">Ja</button>

	</div>

	<img id="home" alt="Home-Button" class="home" src="images/home.png">

	<script src="script.js"></script>

</body>

</html>
